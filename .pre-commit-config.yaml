# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# 排除运行时数据 / 静态资源（不应被 pre-commit 修改）
exclude: '^(sessions/|module/failed_tasks.json|module/static/|module/templates/|screenshot/|\.venv/|downloads/|log/|temp/)'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
-   repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
    -   id: black
        name: black
        entry: black
        types: [python]
-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        name: isort
        entry: isort
        types: [python]
        args: ["--profile", "black", "--filter-files"]
# mypy / pylint 暂从 CI 中移除：
# - mypy 对历史代码（无完整类型标注）产生 200+ 误报
# - pylint 的 cyclic-import 无法识别重构中有意的延迟导入解耦
# 本地可选运行：make static_type_check / make pylint
